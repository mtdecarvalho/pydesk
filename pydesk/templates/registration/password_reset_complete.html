{% extends "base.html" %}

{% block title %}PyDesk - Senha alterada{% endblock %}

{% block conteudo %}
<div class="mx-auto w-full max-w-md py-6">
    <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <!-- Cabeçalho do cartão -->
        <div class="border-b border-slate-200 bg-slate-50 px-6 py-5">
            <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-green-600 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-semibold text-slate-900">Senha alterada com sucesso!</h1>
                    <p class="text-sm text-slate-500">Sua nova senha já está ativa.</p>
                </div>
            </div>
        </div>

        <div class="px-6 py-6">
            <div class="mb-5 rounded-md border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700" role="status">
                Tudo certo! Você já pode acessar o PyDesk usando sua nova senha.
            </div>

            <a href="{% url 'login' %}"
               class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                </svg>
                Entrar novamente
            </a>
        </div>
    </div>
</div>
{% endblock %}
