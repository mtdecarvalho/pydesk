{% extends "base.html" %}

{% block conteudo %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="bg-brand-700 px-6 py-8 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-white/20">
          <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
        </div>
        <h1 class="text-xl font-semibold text-white">Recuperar senha</h1>
        <p class="mt-1 text-sm text-white/80">Informe seu email para receber as instruções de redefinição.</p>
      </div>

      <form action="" method="post" class="px-6 py-8 space-y-5">
        {% csrf_token %}

        {% if form.email.errors %}
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ form.email.errors }}
        </div>
        {% endif %}

        <div class="space-y-1.5">
          <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            type="email"
            name="{{ form.email.html_name }}"
            id="{{ form.email.id_for_label }}"
            value="{{ form.email.value|default:'' }}"
            required
            autofocus
            placeholder="voce@empresa.com"
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-brand-600 focus:ring-2 focus:ring-brand-600/30 focus:outline-none"
          >
        </div>

        <button
          type="submit"
          class="w-full rounded-lg bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-brand-600/40"
        >
          Resetar a senha
        </button>

        <p class="text-center text-sm text-gray-500">
          <a href="{% url 'login' %}" class="font-medium text-brand-700 hover:underline">Voltar para o login</a>
        </p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
