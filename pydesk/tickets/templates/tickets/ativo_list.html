{% extends "base.html" %}

{% block titulo %}
  <title>PyDesk - Ativos</title>
{% endblock titulo %}

{% block conteudo %}
    <h1>Ativos</h1>
  {% if ativo_list %}
    <ul>
      {% for ativo in ativo_list %}
      <li>
        <a href="{{ ativo.get_absolute_url }}">{{ ativo }}</a>
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Nenhum ativo disponivel</p>
  {% endif %}
{% endblock conteudo %}
