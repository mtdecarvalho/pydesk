{% extends "base.html" %}

{% block titulo %}
  <title>PyDesk - Tickets</title>
{% endblock titulo %}

{% block conteudo %}
    <h1>Tickets</h1>
  {% if ticket_list %}
    <ul>
      {% for ticket in ticket_list %}
      <li>
        <a href="{{ ticket.get_absolute_url }}">{{ ticket }}</a>
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Nenhum ticket disponivel</p>
  {% endif %}
{% endblock conteudo %}
